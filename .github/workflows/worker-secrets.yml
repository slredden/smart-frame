# Copies the Worker's secrets from this repo's GitHub secrets into the smart-frame Worker with
# `wrangler secret bulk` (tools/set-worker-secrets.mjs). Manual only. Never echoes a value.
# Refuses if any secret is missing or malformed, or if the Worker hasn't been deployed yet.
# Uses the same deploy token as deploy.yml; no second Cloudflare token exists anywhere.
name: worker-secrets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  set-secrets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL_SIGNING_KEY: ${{ secrets.URL_SIGNING_KEY }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          HEALTH_TOKEN_HASH: ${{ secrets.HEALTH_TOKEN_HASH }}
          PUBLISH_TOKEN_HASH: ${{ secrets.PUBLISH_TOKEN_HASH }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node tools/set-worker-secrets.mjs
