# smart-frame deploy: main → the amber-heron Worker on workers.dev.
# OFF until Stephen adds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and sets the
# repository variable DEPLOY_ENABLED=true (PLAN.md §12). The token is deploy-only for this one Worker.
# Never touches secrets, D1 or KV contents. Output is filtered by tools/deploy-worker.mjs.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG: "log"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build id
        run: echo "BUILD_ID=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Deploy amber-heron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/deploy-worker.mjs
